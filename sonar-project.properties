sonar.projectKey=acts-project_acts
sonar.organization=acts-project

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=acts
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.
sonar.tests=Tests

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/*.py,Tests/**/*,spack/**/*,Detray/tests/**/*,Traccc/tests/**/*
# Detray and Traccc stay in the analysis, but are kept out of the coverage
# metric for the time being. CI/test_coverage.py already drops them from
# cov.xml; this states the same intent on the Sonar side.
sonar.coverage.exclusions=Examples/**/*,docs/**/*,Detray/**/*,Traccc/**/*,**/*.py
