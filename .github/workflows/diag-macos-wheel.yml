name: diag-macos-wheel

# TEMPORARY diagnostics workflow (delete before merging the real fix).
# Push-triggered so it runs from this branch's commit directly, without needing
# the workflow on the fork's default branch. Builds a single macOS wheel to
# capture the delocate `libssl.3.dylib` linkage dump from CI/repair_wheel_macos.sh.
on:
  push:
    branches:
      - fix/pypi-macos-arrow-delocate

permissions: {}

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: acts
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Build single macOS wheel (diagnostics)
        run: acts/CI/cibuildwheel.sh acts
        env:
          CIBW_BUILD: "cp311-*"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CCACHE_DIR: ${{ github.workspace }}/ccache
