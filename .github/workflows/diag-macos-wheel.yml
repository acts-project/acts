name: diag-macos-wheel

# TEMPORARY diagnostics workflow (delete before merging the real fix).
# Push-triggered so it runs from this branch's commit directly, without needing
# the workflow on the fork's default branch. Builds a single macOS wheel to
# validate the narrowed CI/repair_wheel_macos.sh (libthrift-only openssl fixup).
on:
  push:
    branches:
      - fix/pypi-macos-arrow-delocate

permissions: {}

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: acts
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Build single macOS wheel (diagnostics)
        run: acts/CI/cibuildwheel.sh acts
        env:
          CIBW_BUILD: "cp311-*"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CCACHE_DIR: ${{ github.workspace }}/ccache
