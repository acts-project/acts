name: Traccc

on:
  push:
    # The release branches (keep in sync with release.yml) carry a tree the
    # merge queue has already built. The queue's own temp ref triggers
    # merge_group below; a push run there shares its concurrency group and
    # evicts the PR from the queue.
    branches-ignore:
      - 'releases'
      - 'release/**'
      - 'gh-readonly-queue/**'
    paths:
      - "Traccc/**"
      - "Detray/**"
      - ".github/workflows/traccc.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Traccc/**"
      - "Detray/**"
      - ".github/workflows/traccc.yml"
  # merge_group does not support path filters, so this runs on every queue
  # entry targeting main, not just ones touching Traccc/ or Detray/. Only
  # required via merge-sentinel's "Traccc / *" pattern, which is itself
  # path-gated, so a non-Traccc entry running this wastes compute but doesn't
  # block merging.
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Never cancel a merge_group run: it's a required check for a queue entry,
  # and a cancellation reads as a failure to the queue, ejecting the PR.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  containers:
    name: ${{ matrix.platform.name }}-${{ matrix.build }}
    runs-on: ubuntu-latest
    container: ${{ matrix.platform.container }}
    permissions:
      contents: read
      # Authenticated GHCR reads for the spack buildcache; without it reads
      # fall back to the anonymous, heavily rate limited bucket.
      packages: read
    strategy:
      # A broken leg must not cancel the others: which of them is affected is
      # the useful part of the signal, and the CUDA-Release leg feeds the
      # artifact `cuda-test` below consumes.
      fail-fast: false
      matrix:
        platform:
          - name: CPU
            container: ghcr.io/acts-project/ubuntu2604:91
            options: --preset host-fp32
            run_tests: true
            enable_cuda: false
            flavor: ""
          # Distinct name because merge-sentinel deduplicates result items by
          # normalised name: two legs called CPU collapse into one check.
          - name: CPU_FP64
            container: ghcr.io/acts-project/ubuntu2604:91
            options: --preset host-fp64
            run_tests: false
            enable_cuda: false
            flavor: ""
        build:
          - Release
          - Debug
        include:
          # CUDA fp32 is spelled out per build type rather than riding the
          # `platform` x `build` cross: the two legs want opposite things from
          # TRACCC_BUILD_TESTING.
          #
          # Release builds the tests and ships the tree to `cuda-test` below,
          # so the device code it compiles is the device code that runs. The
          # full five-detector list is kept rather than trimmed to what the
          # tests strictly need: this leg pays for their device code either
          # way, and trimming would drop the toy-detector CKF tests from the
          # GPU run.
          - platform:
              name: CUDA
              container: ghcr.io/acts-project/ubuntu2604:91
              options: --preset cuda-fp32
              run_tests: false
              upload_build: true
              enable_cuda: true
              flavor: cuda13
            build: Release
          # Debug exists for the FP64 PTX check, which needs the `--keep` that
          # only lands in CMAKE_CUDA_FLAGS_DEBUG
          # (Traccc/cmake/traccc-compiler-options-cuda.cmake:34). Tests off:
          # building them under `-G --keep` is very slow for no added signal.
          - platform:
              name: CUDA
              container: ghcr.io/acts-project/ubuntu2604:91
              options: --preset cuda-fp32 -DTRACCC_BUILD_TESTING=FALSE
              run_tests: false
              enable_cuda: true
              flavor: cuda13
            build: Debug
          # Distinct name for the sentinel dedup reason above -- as plain CUDA
          # this and the fp32 Release leg both render as "CUDA-Release". Tests
          # off: this is a compile check, no GPU job consumes an fp64 build,
          # and the preset would otherwise build the whole suite to discard it.
          - platform:
              name: CUDA_FP64
              container: ghcr.io/acts-project/ubuntu2604:91
              options: --preset cuda-fp64 -DTRACCC_BUILD_TESTING=FALSE
              run_tests: false
              enable_cuda: true
              flavor: cuda13
            build: Release
          - platform:
              name: "ALPAKA_CPU"
              container: ghcr.io/acts-project/ubuntu2604:91
              options: --preset alpaka-fp32
              run_tests: true
              enable_cuda: false
              flavor: ""
            build: Release
          - platform:
              name: "ALPAKA_CUDA"
              container: ghcr.io/acts-project/ubuntu2604:91
              options: --preset alpaka-fp32 -Dalpaka_ACC_GPU_CUDA_ENABLE=ON -DTRACCC_FAIL_ON_WARNINGS=OFF -DTRACCC_BUILD_CUDA_UTILS=ON
              run_tests: false
              enable_cuda: true
              flavor: cuda13
            build: Release
          # ALPAKA_HIP is dropped here: it's still on the pre-spack
          # ubuntu2404_rocm image (no `flavor`, so it never gets a dependency
          # install this PR would touch), and the HIP alpaka migration lands
          # in a later PR in this stack.
    # Use BASH as the shell from the images.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/dependencies
        with:
          compiler: g++
          flavor: ${{ matrix.platform.flavor }}
          # Ahead of the repo default: flavors need v24.0.0 or newer.
          DEPENDENCY_TAG: v24.1.0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          env_file: .env

      # vecmem, covfie and alpaka come from spack on every leg: the host
      # lockfile carries them and each flavor overlays its own build, so no
      # per-leg gating is needed. TRACCC_USE_SYSTEM_ALPAKA is unconditional
      # because traccc only acts on it under TRACCC_SETUP_ALPAKA.

      - name: Configure
        run: |
          source ${GITHUB_WORKSPACE}/.env
          source ${GITHUB_WORKSPACE}/Traccc/.github/ci_setup.sh ${{ matrix.platform.name }}
          cmake \
            -DCMAKE_BUILD_TYPE=${{ matrix.build }} \
            ${{ matrix.platform.options }} \
            -DACTS_USE_SYSTEM_NLOHMANN_JSON=ON \
            -DACTS_USE_SYSTEM_COVFIE=ON \
            -DACTS_USE_SYSTEM_VECMEM=ON \
            -DACTS_USE_SYSTEM_EIGEN3=ON \
            -DACTS_ENABLE_CUDA=${{ matrix.platform.enable_cuda && 'ON' || 'OFF' }} \
            -DTRACCC_USE_SYSTEM_VECMEM=ON \
            -DTRACCC_USE_SYSTEM_COVFIE=ON \
            -DTRACCC_USE_SYSTEM_ALPAKA=ON \
            -DDETRAY_USE_SYSTEM_NLOHMANN=ON \
            -DDETRAY_USE_SYSTEM_GOOGLETEST=ON \
            -DTRACCC_USE_SYSTEM_GOOGLETEST_DEFAULT=ON \
            -DTRACCC_SETUP_GOOGLETEST=ON \
            -DTRACCC_SUPPORTED_DETECTORS="default_detector;odd_detector;telescope_detector;toy_detector;itk_detector" \
            -DDETRAY_GENERATE_METADATA="itk_metadata" \
            -S ${GITHUB_WORKSPACE}/Traccc \
            -B build
      - name: Build
        run: |
          source ${GITHUB_WORKSPACE}/.env
          source ${GITHUB_WORKSPACE}/Traccc/.github/ci_setup.sh ${{ matrix.platform.name }}
          cmake --build build -- -j $(nproc)
      - name: Download data files
        if: "matrix.platform.run_tests"
        run: ${GITHUB_WORKSPACE}/Traccc/data/traccc_data_get_files.sh
      - name: Test
        if: "matrix.platform.run_tests && matrix.build == 'Release'"
        run: |
          source ${GITHUB_WORKSPACE}/.env
          cd build
          source ${GITHUB_WORKSPACE}/Traccc/.github/ci_setup.sh ${{ matrix.platform.name }}
          ctest --output-on-failure
      - name: FP64 Compliance
        if: "matrix.platform.name == 'CUDA' && matrix.build == 'Debug'"
        continue-on-error: true
        run: ${GITHUB_WORKSPACE}/Traccc/.github/find_f64_ptx.py --source ${GITHUB_WORKSPACE}/Traccc --build build $(find build -name "*.ptx")

      # The tree restores under the workspace because its CTestTestfile.cmake
      # carries absolute paths from configure time. build/_deps stays: covfie
      # also arrives via FetchContent and loads from there at runtime. `.a`
      # files go, being link-time only.
      - name: Package build
        if: matrix.platform.upload_build
        run: tar czf build.tar.gz -C build --exclude "*.o" --exclude "*.a" .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.platform.upload_build
        with:
          name: traccc-cuda-build
          path: build.tar.gz
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────
  # Nothing is compiled here; the job exists purely to spend GPU time on tests.
  #
  # `needs: containers` waits on the whole matrix rather than just the leg that
  # produced the artifact, because a job cannot depend on a single matrix leg.
  # With one GPU node in the pool that costs nothing real: the job would be
  # queueing for the node anyway.
  # ─────────────────────────────────────────────────────────────────────
  cuda-test:
    needs: [containers]
    runs-on: [self-hosted, linux, x64, gpu-nvidia]
    permissions:
      contents: read
      packages: read
    container:
      image: registry.cern.ch/ghcr.io/acts-project/ubuntu2604:91
      options: --gpus all

    env:
      # ci_setup.sh would set this to nproc. These tests allocate sizeable
      # device buffers, and one T4's 16 GB is the binding constraint rather
      # than the core count, so cap it at two at a time.
      CTEST_PARALLEL_LEVEL: 2

    defaults:
      run:
        shell: bash

    steps:
      # Has to land at the absolute path the build was configured at:
      # traccc_add_test bakes TRACCC_TEST_DATA_DIR=${PROJECT_SOURCE_DIR}/data
      # into each test's environment at configure time. What makes that work
      # across machines is the container -- the workspace is /__w/acts/acts on
      # every runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Fails the job early if no device is visible, and puts the driver
      # version and GPU model in the log -- which is what you want to hand
      # someone when numerics differ between nodes.
      - name: Check GPU
        run: nvidia-smi

      # Not a rebuild: the binaries RPATH into the spack view, so it has to
      # exist at the same workspace path. Same lockfile, same result, and the
      # spack cache keeps this a restore rather than an install.
      - name: Install dependencies
        uses: ./.github/actions/dependencies
        with:
          compiler: g++
          flavor: cuda13
          DEPENDENCY_TAG: v24.1.0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          env_file: .env

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: traccc-cuda-build

      - name: Unpack build
        run: mkdir build && tar xf build.tar.gz -C build

      - name: Download data files
        run: ${GITHUB_WORKSPACE}/Traccc/data/traccc_data_get_files.sh

      # ctest -R is case-sensitive, so the regex spells out both cases: the
      # lowercase-named GPU tests (grids_cuda.*) are otherwise skipped silently.
      # --no-tests=error for the same reason: the whole job is a `-R` filter, and
      # ctest's default is to report success on an empty set, so a regex that
      # stops matching would leave the job green having run nothing.
      - name: Test
        run: |
          source ${GITHUB_WORKSPACE}/.env
          ctest --test-dir build --output-on-failure --no-tests=error -R "[Cc][Uu][Dd][Aa]"
