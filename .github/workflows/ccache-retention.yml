name: Compiler cache retention

on:
  # Kept for manual cleanup of archives from before the S3 cutover.
  workflow_dispatch:
    inputs:
      apply:
        description: Delete superseded main compiler-cache archives
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ccache-retention
  cancel-in-progress: false

jobs:
  prune:
    if: github.repository == 'acts-project/acts' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Retain newest compiler caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=()
          if [[ "$APPLY" == "true" ]]; then
            args+=(--apply)
          fi
          python3 CI/prune_ccache.py "${args[@]}"
