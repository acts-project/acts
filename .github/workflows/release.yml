name: Release

on:
  push:
    branches:
      - 'releases'
      - 'release/**'

permissions:
  contents: write

jobs:
  release:
    name: Make release
    # ubuntu-slim doesn't ship CMake, which CI/release.sh now needs to verify
    # the source archive it builds (see the codegen_prebuilt job in
    # checks.yml).
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        # persisted credentials are required: CI/release.sh pushes the version
        # bump commit back to the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # setup-uv caches by default, which on a push to a protected branch
          # that publishes the resulting release artifact is exactly the
          # pattern zizmor's cache-poisoning audit flags: a poisoned cache
          # entry could taint the released tarball. It also runs rarely enough
          # that the cache wouldn't pay for itself.
          enable-cache: false

      - name: Install git-cliff
        run: |
          curl -L https://github.com/orhun/git-cliff/releases/download/v2.12.0/git-cliff-2.12.0-x86_64-unknown-linux-musl.tar.gz > git-cliff.tar.gz
          echo "c89a7bc55f3c51f391938aa3fa560125109695c1930d927879daea68dd786420  git-cliff.tar.gz" | sha256sum -c
          mkdir git-cliff
          tar xzf git-cliff.tar.gz --strip-components 1 --directory git-cliff
          cp git-cliff/git-cliff /usr/local/bin/git-cliff

      - name: Create release
        env:
          # for gh cli
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # for git-cliff
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN}}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          CI/release.sh
