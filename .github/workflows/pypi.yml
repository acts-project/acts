name: PyPI

# Nightly builds on schedule; release builds triggered manually via workflow_dispatch
on:
  schedule:
    - cron: '5 3 * * *'
  workflow_dispatch:
    inputs:
      acts_ref:
        description: 'Acts ref to build (e.g. v39.3.0) — leave empty to trigger a nightly build'
        required: false
        type: string
  # TEMPORARY (this branch only, revert before merge): run as a PR check to
  # validate the narrowed CI/repair_wheel_macos.sh against a real cibuildwheel
  # build. This only affects PR #5742's own checks — the trigger only exists on
  # this branch's commits, not on main, so it can't fire for any other PR.
  pull_request:

env:
  CCACHE_DIR: ${{ github.workspace }}/ccache
  CCACHE_KEY_SUFFIX: r2

permissions: {}

jobs:
  # Prepare step: get unique time-stamp and checkout of the repo (otherwise main
  # could get updated during matrix jobs and code could differ between builds)
  prepare:
    runs-on: ubuntu-latest
    permissions: {}
    if: github.repository == 'acts-project/acts' || github.event_name != 'schedule'
    steps:
      - name: Set build version
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.acts_ref == ''
        run: echo "dev$(date +%Y%m%d%H%M%S)" > build_version.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.acts_ref == ''
        with:
          name: build-version
          path: build_version.txt

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TEMPORARY: `|| github.event.pull_request.head.sha` makes the
          # pull_request trigger above build this PR's own commit instead of
          # main; revert alongside the trigger.
          ref: ${{ github.event.inputs.acts_ref || github.event.pull_request.head.sha || 'main' }}
          path: acts
          persist-credentials: false

      - name: Package source as tarball
        run: tar czf acts-source.tar.gz acts/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acts-source
          path: acts-source.tar.gz

  build_wheels:
    needs: prepare
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions: {}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os:
         # TEMPORARY (this branch only): macOS-only to validate
         # CI/repair_wheel_macos.sh without spending time on the unaffected
         # Linux build. Restore ubuntu-latest before merge.
         - macos-26

    steps:
      - name: Download source tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acts-source

      - name: Extract source tarball
        run: tar xzf acts-source.tar.gz

      - name: Download build version
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.acts_ref == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-version

      - name: print build version
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.acts_ref == ''
        run: cat build_version.txt

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Determine CIBW_BUILD
        id: cibw
        # TEMPORARY: single Python version on pull_request to keep this PR's
        # validation build fast; full matrix otherwise. Revert before merge.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "build=cp311-*" >> "$GITHUB_OUTPUT"
          else
            echo "build=$(acts/CI/supported_python_versions.py --cibw)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build wheels
        uses: ./acts/.github/actions/cibuildwheel_wrapper
        with:
          package-dir: acts
          cibw-build: ${{ steps.cibw.outputs.build }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Patch version to dev version
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.acts_ref == ''
        run: |
          PATCHED_VERSION="$(cat acts/version_number).$(cat build_version.txt)"
          echo "Patch to version $PATCHED_VERSION"
          python3 -m pip install change-wheel-version==0.6.0
          cd wheelhouse
          for f in ./*.whl; do
            change_wheel_version $f --version $PATCHED_VERSION --delete-old-wheel
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl


  upload_pypi_test:
    needs: build_wheels
    # TEMPORARY: explicitly excludes pull_request (added above) so the
    # diagnostic PR-check build never attempts a test-PyPI publish. Revert
    # alongside the pull_request trigger.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.acts_ref == '')
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pyacts
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - name: Get wheels
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: cibw-*
        path: dist
        merge-multiple: true

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
      with:
        packages-dir: dist
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
        verbose: true

  upload_pypi:
    needs: build_wheels
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.acts_ref != ''
    environment:
      name: pypi
      url: https://pypi.org/project/pyacts
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - name: Get wheels
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: cibw-*
        path: dist
        merge-multiple: true

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
      with:
        packages-dir: dist
        skip-existing: true
        verbose: true
