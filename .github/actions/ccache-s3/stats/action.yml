name: 'ccache snapshot statistics'
description: 'Write ccache statistics to the job log and summary'
runs:
  using: composite
  steps:
    - name: ccache statistics
      continue-on-error: true
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        bash "$ACTION_PATH/../../../../CI/ccache_stats.sh"
        echo '### ccache statistics' >> "$GITHUB_STEP_SUMMARY"
        echo '```text' >> "$GITHUB_STEP_SUMMARY"
        ccache --show-stats --verbose | tee -a "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
