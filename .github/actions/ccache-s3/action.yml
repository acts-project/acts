name: 'ccache S3 snapshots'
description: 'Restore or publish a complete local ccache snapshot in CERN S3'
inputs:
  operation:
    description: 'restore (anonymous) or publish (authorized main runs)'
    default: restore
  key-prefix:
    description: 'Snapshot namespace for this repository and build variant'
    required: true
  access-key-id:
    description: 'S3 access key; required only for publication'
    default: ''
  secret-access-key:
    description: 'S3 secret key; required only for publication'
    default: ''
  allow-main-non-push:
    description: 'Allow scheduled/manual main publication (nightly wheels only)'
    default: 'false'
runs:
  using: composite
  steps:
    - name: Transfer ccache snapshot
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CACHE_ALLOW_MAIN_NON_PUSH: ${{ inputs.allow-main-non-push }}
        CACHE_OPERATION: ${{ inputs.operation }}
        CACHE_PREFIX: ${{ inputs.key-prefix }}
        CACHE_ENDPOINT: https://s3.cern.ch
        CACHE_REGION: cern
        CACHE_BUCKET: cache
        AWS_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
        AWS_EC2_METADATA_DISABLED: 'true'
      run: |
        uv run --locked --no-project --no-build "$ACTION_PATH/../../../CI/ccache_snapshot.py" "$CACHE_OPERATION"
