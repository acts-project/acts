name: 'ccache S3 snapshots'
description: 'Restore ccache from CERN S3 and publish after successful main jobs'
inputs:
  key-prefix:
    description: 'Snapshot namespace for this repository and build variant'
    required: true
  access-key-id:
    description: 'S3 access key; required only for publication'
    default: ''
  secret-access-key:
    description: 'S3 secret key; required only for publication'
    default: ''
runs:
  using: node24
  main: action.cjs
  post: action.cjs
  post-if: success()
