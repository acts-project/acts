[checks."*".Chi2Test]
threshold = 0.01

[checks."*".KolmogorovTest]
threshold = 0.68

[checks."*".RatioCheck]
threshold = 3

[checks."*".ResidualCheck]
threshold = 3

[checks."*".IntegralCheck]
threshold = 3

# Case-sensitive globs against histogram keys; tags may overlap.
[report.tags]
"Track summary" = ["*nStates*", "*nMeasurements*", "*nHoles*", "*nOutliers*", "*nSharedHits*", "*nMajorityHits*"]
"Residuals" = ["res_*", "resmean_*", "reswidth_*", "trk_res*", "resX", "resY", "resZ", "resT", "resSeed*"]
"Pulls" = ["pull*", "trk_pull*"]
"Resolution" = ["reswidth_*", "pullwidth_*"]
"Bias" = ["resmean_*", "pullmean_*"]
"Kinematics" = ["p", "pt", "p[xyz]", "eta", "phi", "m", "q", "*_vs_pT*", "*_vs_eta*", "*_vs_phi*"]
