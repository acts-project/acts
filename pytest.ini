[pytest]
testpaths =
    Python/Examples/tests
    Python/Core/tests
    Python/Fatras/tests
    docs/examples
norecursedirs=Python/Examples/tests/helpers
markers =
    csv
    obj
    root
    json
    slow
    edm4hep
    odd
    hepmc3
    pypi
    xdist_group: run on the same pytest-xdist worker as the rest of the group (--dist loadgroup)
filterwarnings =
    error
