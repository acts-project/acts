rules:
  # Lint PR / Validate PR title only runs on pull_request_target, never on
  # merge_group, so it can't be required here: merge-sentinel would sit
  # pending on every merge-queue entry until the queue's check timeout
  # evicts it. PR title format is still enforced continuously by that
  # workflow pre-queue; this only skips re-verifying it at merge time.
  - required_pattern:
      - "policy-bot: *"

  - branch_filter:
     - "main"
     - "develop/*"
    paths_ignore:
     - "docs/*"

    required_checks:
     - Docs / docs
     - Analysis / build_debug
     # - SonarCloud Code Analysis

    # Only list a class of check that actually reports: a required_pattern
    # matching nothing is not ignored, it is injected as a synthetic *failure*
    # item, so a stale entry red-gates every pull request.
    required_pattern:
     - "Builds / *"
     - "Checks / *"

  - branch_filter:
     - "main"
     - "develop/*"
    paths:
     - "docs/*"
    required_checks:
     - Docs / docs

  - branch_filter:
     - "main"
     - "develop/*"
    paths:
     # Both spellings: the glob engine here is undocumented, so which one is
     # recursive cannot be assumed.
     - "Detray/*"
     - "Detray/**/*"
     - ".github/workflows/detray.yml"
    required_pattern:
     - "Detray / *"

  # Without this the Traccc jobs run on a queue entry but do not gate it:
  # pending only blocks when required, and they take ~25 minutes, so the
  # aggregate would go green long before they report. A Detray-only change
  # still runs them (traccc.yml triggers on Detray/** too) and a *failure*
  # fails the gate whether required or not -- only the wait is missing there.
  - branch_filter:
     - "main"
     - "develop/*"
    paths:
     - "Traccc/*"
     - "Traccc/**/*"
     - ".github/workflows/traccc.yml"
    required_pattern:
     - "Traccc / *"
