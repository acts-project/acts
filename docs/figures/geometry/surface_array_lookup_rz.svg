<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img"
     aria-label="Lookup geometry in the r-z plane: staggered modules at two radii, the representative cylinder, an inclined track and the slide in z through the layer thickness">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #5b6473; }
    .ink { fill: #131720; }
    .acc { fill: #1f5fd0; }
    .alert { fill: #bc3626; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0.5 L8,4 L0,7.5 Z" fill="#131720"/>
    </marker>
  </defs>
  <rect width="640" height="300" fill="#f8fafc"/>

  <!-- z bins: the window the lookup serves, and the crossing bin inside it -->
  <rect x="160" y="30" width="250" height="220" fill="#1f5fd0" fill-opacity=".09"/>
  <rect x="260" y="30" width="50" height="220" fill="#1f5fd0" fill-opacity=".16"/>
  <g stroke="#dde2ea" stroke-width=".6">
    <line x1="60" y1="30" x2="60" y2="250"/>
    <line x1="110" y1="30" x2="110" y2="250"/>
    <line x1="160" y1="30" x2="160" y2="250"/>
    <line x1="210" y1="30" x2="210" y2="250"/>
    <line x1="260" y1="30" x2="260" y2="250"/>
    <line x1="310" y1="30" x2="310" y2="250"/>
    <line x1="360" y1="30" x2="360" y2="250"/>
    <line x1="410" y1="30" x2="410" y2="250"/>
    <line x1="460" y1="30" x2="460" y2="250"/>
    <line x1="510" y1="30" x2="510" y2="250"/>
    <line x1="560" y1="30" x2="560" y2="250"/>
    <line x1="610" y1="30" x2="610" y2="250"/>
  </g>
  <text x="285" y="44" text-anchor="middle" class="acc">window: 2 bins each side</text>

  <!-- layer thickness: the tolerance the array was built with -->
  <g stroke="#5b6473" stroke-width=".8" stroke-dasharray="3 3">
    <line x1="60" y1="115" x2="610" y2="115"/>
    <line x1="60" y1="165" x2="610" y2="165"/>
  </g>
  <g stroke="#5b6473" stroke-width="1">
    <line x1="74" y1="115" x2="74" y2="140"/>
    <line x1="71" y1="115" x2="77" y2="115"/>
    <line x1="71" y1="140" x2="77" y2="140"/>
  </g>
  <text x="80" y="131">tolerance</text>

  <!-- representative cylinder at radius R -->
  <line x1="60" y1="140" x2="610" y2="140" stroke="#1f5fd0" stroke-width="1.5"/>
  <text x="608" y="134" text-anchor="end" class="acc">representative cylinder</text>

  <!-- footprint of the hit module on the representative surface: bins 5, 6, 7 -->
  <rect x="310" y="137" width="150" height="6" fill="#1f5fd0" fill-opacity=".35"/>
  <text x="385" y="156" text-anchor="middle" class="acc">registered footprint</text>

  <!-- modules, staggered on two radii -->
  <g fill="#5b6473">
    <rect x="60" y="157" width="80" height="6"/>
    <rect x="250" y="157" width="110" height="6"/>
    <rect x="420" y="157" width="110" height="6"/>
    <rect x="130" y="117" width="130" height="6"/>
    <rect x="520" y="117" width="90" height="6"/>
  </g>
  <rect x="320" y="117" width="110" height="6" fill="#1f5fd0"/>
  <text x="608" y="181" text-anchor="end">modules at two radii</text>

  <!-- the track, and the chord it cuts through the layer -->
  <line x1="225" y1="165" x2="385" y2="115" stroke="#1f5fd0" stroke-opacity=".35" stroke-width="6"/>
  <line x1="100" y1="204" x2="560" y2="60" stroke="#131720" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="108" y="222" class="ink">track</text>
  <text x="236" y="178" class="ink">half chord = tolerance / |n.d|</text>

  <!-- crossing of the representative surface, and the hit -->
  <circle cx="305" cy="140" r="3.5" fill="#1f5fd0"/>
  <text x="298" y="134" text-anchor="end" class="acc">crossing</text>
  <circle cx="369" cy="120" r="3.5" fill="#bc3626"/>
  <text x="376" y="111" class="alert">hit</text>

  <!-- the slide: the chord without its component along the normal -->
  <g stroke="#131720" stroke-width="1">
    <line x1="225" y1="232" x2="385" y2="232"/>
    <line x1="225" y1="228" x2="225" y2="236"/>
    <line x1="305" y1="228" x2="305" y2="236"/>
    <line x1="385" y1="228" x2="385" y2="236"/>
  </g>
  <text x="265" y="246" text-anchor="middle" class="ink">slide</text>
  <text x="345" y="246" text-anchor="middle" class="ink">slide</text>

  <!-- axes -->
  <text x="22" y="143">r</text>
  <text x="610" y="270" text-anchor="end">z</text>
  <text x="335" y="270" text-anchor="middle">bins 2 to 6 are served; the module the track hits is registered in bins 5 to 7</text>
</svg>
